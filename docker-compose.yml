services:

  db:
    image: postgres:17-alpine
    container_name: researchgate-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchgate}
      POSTGRES_USER: ${POSTGRES_USER:-researchgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - researchgate_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-researchgate} -d ${POSTGRES_DB:-researchgate}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - researchgate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: researchgate-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-researchgate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-researchgate}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - researchgate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: researchgate-frontend
    restart: unless-stopped

    ports:
      - "8501:8501"

    depends_on:
      - backend

    networks:
      - researchgate-network

volumes:
  researchgate_postgres_data:

networks:
  researchgate-network:
    driver: bridge
